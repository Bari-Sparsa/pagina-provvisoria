<title>barisparsa.it</title>
<style>
:root { --rosa:#FFDCDE; --rosso:#FF3333; --lime:#EAFF9C; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; background:#000; }
body {
  margin: 0; min-height: 100svh; background: #000; color: var(--rosa);
  font: 1rem/1.4 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  display: grid; place-items: center; text-align: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { display: grid; justify-items: center; gap: clamp(20px, 5svh, 40px); }
svg { width: min(60vw, 38svh, 300px); height: auto; overflow: visible; }
rect { fill: var(--rosa); opacity: .1; animation: onda 5.2s ease-in-out infinite; animation-delay: calc(var(--i) * .16s); }
@keyframes onda {
  0%   { opacity: .1; fill: var(--rosa); }
  10%  { opacity: 1;  fill: var(--rosso); }
  28%  { opacity: 1;  fill: var(--lime); }
  50%  { opacity: .1; fill: var(--rosa); }
  100% { opacity: .1; fill: var(--rosa); }
}
h1 { margin: 0; font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
p { margin: .6rem 0 0; font-size: clamp(.8rem, 2.8vw, 1rem); letter-spacing: .24em; text-transform: uppercase; opacity: .75; }
p::after { content: "_"; animation: lampeggia 1s steps(1) infinite; }
@keyframes lampeggia { 50% { opacity: 0; } }
button {
  position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  font: inherit; font-size: .8rem; color: var(--rosa); background: transparent;
  border: 1px solid rgba(255,220,222,.4); border-radius: 999px; padding: .5rem .9rem; min-height: 44px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.fermo rect, .fermo p::after { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) {
  rect { animation: none; opacity: 1; fill: var(--rosa); }
  p::after { animation: none; }
  button { display: none; }
}
</style>
