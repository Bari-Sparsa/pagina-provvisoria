<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFDCDE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0708" media="(prefers-color-scheme: dark)">
<title>Bari Sparsa — Gestione interna</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bari Sparsa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* I caratteri di Luca (Worldstar, Rockstar) sono «solo uso personale»: i file stanno in font/, fuori da git, e online
   non ci sono. Senza file il browser passa da solo ai sostituti, Instrument Serif e Archivo stretto. */
@font-face{font-family:"Worldstar";src:url(font/Worldstar.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Rockstar";src:url(font/Rockstar-ExtraBold.otf) format("opentype");font-display:swap}
/* Il linguaggio è quello delle tavole di Luca: fondo rosa, fasce rosse con la scritta larga, domande in graziato
   dentro etichette lime, blocchi inclinati in trasparenza. Caratteri: Archivo e Instrument Serif fanno da sostituti
   finché Luca non dice i nomi dei suoi. Il movimento ha una curva sola (--e) e tre durate. */
:root{
  --rosso:#FF3333; --lime:#EAFF9C; --rosa:#FFDCDE;
  --fondo:#FFDCDE; --carta:#FFF5F5; --ink:#000; --tenue:#6A4347; --riga:#EBC6C9; --blocchi:#E2BABE; --vetro:rgba(255,220,222,.78);
  --e:cubic-bezier(.2,0,0,1); --e-in:cubic-bezier(.05,.7,.1,1); --e-out:cubic-bezier(.3,0,1,1);
  --t1:140ms; --t2:260ms; --t3:420ms;
  --largo:"Archivo",system-ui,sans-serif; --grazia:"Worldstar","Instrument Serif",Georgia,serif; --stretto:"Rockstar","Archivo",system-ui,sans-serif;
  --nav:68px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#0D0708; --carta:#1B1012; --ink:#FFDCDE; --tenue:#C99DA2; --riga:#3A2326; --blocchi:#2A1517; --vetro:rgba(13,7,8,.78); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--fondo);color:var(--ink);font:16px/1.45 var(--largo);font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
a{color:inherit}

/* sfondo: i blocchi delle tavole, che scivolano piano */
.sfondo{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sfondo i{position:absolute;width:62vmax;height:13vmax;border-radius:3vmax;background:var(--blocchi);opacity:.6;
  transform:rotate(-58deg) skewX(-24deg);animation:deriva 42s ease-in-out infinite alternate;will-change:transform}
.sfondo i:nth-child(1){left:-18vmax;top:4vmax}
.sfondo i:nth-child(2){left:22vmax;top:-10vmax;animation-delay:-12s;animation-duration:51s}
.sfondo i:nth-child(3){left:46vmax;top:30vmax;animation-delay:-25s}
.sfondo i:nth-child(4){left:-6vmax;top:52vmax;animation-delay:-6s;animation-duration:47s}
@keyframes deriva{to{translate:5vmax -4vmax}}

/* i pezzi del linguaggio */
.dom{display:inline-block;background:var(--lime);color:#000;font:400 clamp(24px,5vw,32px)/1 var(--grazia);
  padding:.12em .32em .16em;rotate:-2deg;letter-spacing:-.01em}
.banda{display:block;margin:0;background:var(--rosso);color:#000;font:900 clamp(19px,3.8vw,26px)/1 var(--largo);font-stretch:125%;
  text-transform:uppercase;letter-spacing:.01em;padding:.42em .5em .38em}
.tit{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 12px}
.tit .dom{margin-left:10px;margin-bottom:-6px;position:relative;z-index:1}
.largo{font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:.01em}

/* il logo: BARI, il simbolo inclinato con il bordo rosso, SPARSA corsivo */
.logo{display:flex;align-items:center;gap:.08em;font:900 22px/1 var(--largo);font-stretch:112%;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo em{font-style:italic}
.logo svg{width:1.55em;height:auto;margin:-.3em -.04em;overflow:visible}
.simbolo .bordo rect{fill:var(--rosso);stroke:var(--rosso);stroke-width:30;stroke-linejoin:round}
.simbolo .riempi rect{fill:var(--lime)}
.simbolo.pieno .bordo{display:none}
.simbolo.pieno .riempi rect{fill:var(--ink)}

/* tessere delle persone: il colore e l'icona dell'area */
.tessera{--d:34px;display:inline-grid;place-items:center;width:var(--d);height:var(--d);flex:none;background:var(--c);color:var(--f);border-radius:9px;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
.tessera svg{width:74%;height:74%}
.tessere{display:inline-flex}
.tessere .tessera{--d:24px;border-radius:7px;margin-left:-6px;box-shadow:0 0 0 2px var(--carta)}
.tessere .tessera:first-child{margin-left:0}

/* impianto: telefono */
.testa{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--vetro);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.io-btn{border:0;background:none;padding:0;border-radius:11px}
.io-btn .tessera{--d:38px}
main{padding:14px 16px calc(var(--nav) + 110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;view-transition-name:vista}
nav.schede{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--vetro);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1.5px solid var(--riga)}
.scheda{position:relative;flex:1;border:0;background:none;padding:9px 4px 8px;font:800 11px/1 var(--largo);font-stretch:118%;text-transform:uppercase;
  letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tenue);border-radius:12px;min-height:52px}
.scheda svg{width:22px;height:22px}
.scheda b{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rosso);color:#000;
  font:900 12px/18px var(--stretto);font-stretch:62%}
.scheda[aria-current]{color:#000}
.scheda[aria-current]::before{content:"";position:absolute;inset:0;background:var(--lime);border-radius:12px;z-index:-1;view-transition-name:pill}
.lato{display:none}
.piu{position:fixed;z-index:7;right:16px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;border:0;
  background:var(--rosso);color:#000;box-shadow:0 10px 26px -8px rgba(160,0,0,.55);display:grid;place-items:center;
  transition:transform var(--t1) var(--e),box-shadow var(--t1) var(--e)}
.piu svg{width:26px;height:26px;transition:rotate var(--t2) var(--e)}
.piu:active{transform:scale(.92)}

/* impianto: computer */
@media (min-width:900px){
  .testa{display:none}
  .app{display:grid;grid-template-columns:270px 1fr}
  nav.schede{position:sticky;top:0;height:100dvh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;
    padding:26px 18px;border-top:0;border-right:1.5px solid var(--riga)}
  .lato{display:flex}
  nav .logo{font-size:25px;margin:4px 6px 30px}
  .scheda{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 14px;font-size:13px;min-height:0}
  .scheda b{position:static;margin-left:auto}
  .azioni-lato{margin-top:auto;flex-direction:column;gap:8px}
  main{padding:34px 40px 120px}
  .piu{right:32px;bottom:32px}
}
.colonne{display:flex;flex-direction:column}
.colonne>div{display:contents}
.colonne .novita{order:-1}
@media (min-width:1200px){
  main{max-width:1120px}
  .colonne>div{display:block}
  .colonne .novita{order:0}
  .colonne{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:start}
}
@media (hover:hover){
  .scheda:not([aria-current]):hover{color:var(--ink);background:color-mix(in srgb,var(--lime) 35%,transparent)}
  .piu:hover{transform:translateY(-2px) rotate(-3deg);box-shadow:0 16px 30px -8px rgba(160,0,0,.6)}
  .piu:hover svg{rotate:90deg}
  .btn:hover{transform:translateY(-1px)}
  .riga:hover{background:color-mix(in srgb,var(--carta) 70%,var(--lime))}
}

/* bottoni, campi */
.btn{border:2px solid var(--ink);background:transparent;padding:11px 16px;border-radius:12px;font:800 13px/1 var(--largo);font-stretch:118%;
  text-transform:uppercase;letter-spacing:.03em;min-height:44px;transition:transform var(--t1) var(--e),background var(--t1) var(--e)}
.btn:active{transform:scale(.97)}
.btn.primo{background:var(--rosso);border-color:var(--rosso);color:#000}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#000}
.link{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--tenue)}
.campo{display:flex;flex-direction:column;gap:6px;font:800 11px/1.2 var(--largo);font-stretch:118%;text-transform:uppercase;letter-spacing:.05em}
.campo input,.campo textarea,.area{font:500 16px/1.45 var(--largo);text-transform:none;letter-spacing:0;padding:12px 14px;border:2px solid var(--ink);
  border-radius:12px;background:var(--fondo);width:100%;transition:box-shadow var(--t1) var(--e)}
.campo input:focus,.campo textarea:focus,.area:focus{outline:0;box-shadow:0 0 0 4px var(--lime)}
textarea{resize:vertical;min-height:96px}
.avviso{background:var(--lime);color:#000;padding:12px 14px;border-radius:12px;font-weight:700;margin:0 0 14px}

/* blocchi di contenuto */
.blocco{margin:0 0 30px}
.lista{display:flex;flex-direction:column;background:var(--carta);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--riga)}
.riga{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1.5px solid var(--riga);transition:background var(--t1) var(--e)}
.riga:last-child{border-bottom:0}
.corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.nome{font-weight:700;white-space:pre-wrap;transition:opacity var(--t2) var(--e)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--tenue);font-weight:600}
.meta a{color:var(--ink);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px}
.tardi{background:var(--rosso);color:#000;padding:2px 7px;border-radius:6px;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.oggi{background:var(--lime);color:#000;padding:2px 7px;border-radius:6px;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.fatta .nome{text-decoration:line-through;opacity:.5}
.spenta .nome{opacity:.5}
.vuoto{padding:26px 18px;text-align:center;color:var(--tenue);font-weight:600;border:2px dashed var(--riga);border-radius:16px}
.mini{border:1.5px solid var(--ink);background:transparent;padding:6px 10px;border-radius:9px;font:800 12px/1 var(--largo);min-height:34px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--fondo)}
.via{border:0;background:none;width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1;color:var(--tenue);flex:none}
.via[data-sicuro]{background:var(--rosso);color:#000;width:auto;padding:0 10px;font:800 12px/1 var(--largo)}
.gesti{display:flex;gap:6px;align-items:center;flex:none}

/* la spunta: un quadrato che si riempie di lime e disegna il segno */
.spunta{flex:none;width:30px;height:30px;border:2.5px solid var(--ink);border-radius:9px;background:transparent;padding:0;display:grid;place-items:center;
  transition:background var(--t2) var(--e),transform var(--t1) var(--e)}
.spunta svg{width:18px;height:18px;fill:none;stroke:#000;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;
  transition:stroke-dashoffset var(--t2) var(--e) 60ms}
.spunta[aria-checked="true"]{background:var(--lime);border-color:var(--lime)}
.spunta[aria-checked="true"] svg{stroke-dashoffset:0}
.spunta:active{transform:scale(.88)}

/* il mio spazio */
.ciao{display:flex;align-items:center;gap:16px;margin:4px 0 26px}
.ciao .tessera{--d:68px;border-radius:18px}
.ciao h1{margin:0;font:900 clamp(42px,10vw,64px)/.9 var(--stretto);font-stretch:62%;text-transform:uppercase;letter-spacing:.005em}
.ciao p{margin:6px 0 0;color:var(--tenue);font-weight:600}
.novita .riga{align-items:center}
.tipo{font:800 10px/1 var(--largo);font-stretch:118%;text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:var(--fondo);padding:4px 6px;border-radius:5px}
.salvato{font-size:13px;color:var(--tenue);font-weight:600;min-height:20px;transition:opacity var(--t2) var(--e)}
.persone{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 18px;padding:2px 16px 6px;scrollbar-width:none}
.persone::-webkit-scrollbar{display:none}
.persona{scroll-snap-align:start;flex:none;display:flex;align-items:center;gap:9px;border:2px solid var(--ink);background:transparent;border-radius:14px;
  padding:6px 12px 6px 6px;font-weight:800;min-height:48px;transition:background var(--t1) var(--e),transform var(--t1) var(--e)}
.persona small{font:900 15px/1 var(--stretto);font-stretch:62%;opacity:.7}
.persona[aria-pressed="true"]{background:var(--ink);color:var(--fondo)}
.persona:active{transform:scale(.96)}
details>summary{cursor:pointer;font-weight:800;padding:12px 2px;list-style:none}
details>summary::before{content:"▸ ";display:inline-block;transition:rotate var(--t2) var(--e)}
details[open]>summary::before{rotate:90deg}

/* il foglio per aggiungere: sale dal basso sul telefono, appare al centro sul computer */
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--carta);color:var(--ink);
  max-height:92dvh;transform:translateY(0);transition:transform var(--t3) var(--e-in),overlay var(--t3) allow-discrete,display var(--t3) allow-discrete}
dialog::backdrop{background:rgba(0,0,0,.42);transition:opacity var(--t3) var(--e),overlay var(--t3) allow-discrete,display var(--t3) allow-discrete;opacity:1}
dialog:not([open]){transform:translateY(100%);transition-timing-function:var(--e-out);transition-duration:var(--t2)}
dialog:not([open])::backdrop{opacity:0}
@starting-style{dialog[open]{transform:translateY(100%)} dialog[open]::backdrop{opacity:0}}
.foglio{padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.maniglia{width:44px;height:5px;border-radius:3px;background:var(--riga);margin:0 auto 4px}
.segmenti{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--fondo);padding:5px;border-radius:14px}
.segmenti label{position:relative;text-align:center;padding:11px 4px;border-radius:10px;font:800 12px/1 var(--largo);font-stretch:118%;text-transform:uppercase;cursor:pointer}
.segmenti input{position:absolute;opacity:0;pointer-events:none}
.segmenti label:has(input:checked){background:var(--lime);color:#000}
.scegli{display:flex;flex-wrap:wrap;gap:8px}
.scegli label{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:5px 12px 5px 5px;font-weight:800;cursor:pointer;
  transition:background var(--t1) var(--e)}
.scegli label .tessera{--d:30px}
.scegli.colonna{flex-direction:column;flex-wrap:nowrap;max-height:46dvh;overflow:auto;padding:2px}
.scegli.colonna label{align-items:flex-start;padding:7px 12px 7px 7px}
.ag-testo{font-weight:600;white-space:pre-wrap;line-height:1.35;padding-top:4px}
.ag-idea{margin:0;font-weight:700;white-space:pre-wrap;max-height:5.5em;overflow:hidden}
.cerca{width:100%;margin:0 0 14px}
.foto-scelte,.fotine{display:flex;flex-wrap:wrap;gap:8px}
.fotine{margin-top:8px}
.foto-scelte img,.fotine img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1.5px solid var(--ink);background:var(--riga);display:block}
.fotine button,.foto-scelte button{padding:0;border:0;background:none;cursor:zoom-in;position:relative}
.foto-scelte button{cursor:pointer}
.foto-scelte button::after{content:"×";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--fondo);font:800 14px/20px var(--largo);text-align:center}
#d-foto{max-width:min(96vw,1100px);margin:auto;border-radius:16px;background:#000;transform:none}
#d-foto img,#d-foto video{display:block;max-width:100%;max-height:88dvh;margin:auto}
.fotine .etichetta,.foto-scelte .etichetta{border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--carta);color:var(--ink);
  font:700 12px/1.25 var(--largo);text-align:left;max-width:100%;cursor:pointer}
.foto-scelte .etichetta{padding-right:18px}
.agganci{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.aggancio{border:1.5px solid #000;border-radius:9px;padding:5px 9px;font:700 12px/1.2 var(--largo);background:var(--lime);color:#000;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.scegli input{position:absolute;opacity:0;pointer-events:none}
.scegli label:has(input:checked){background:var(--ink);color:var(--fondo)}
.scegli label:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
@media (min-width:900px){
  dialog{margin:auto;border-radius:24px}
  dialog:not([open]){transform:scale(.96);opacity:0}
  dialog{transition:transform var(--t3) var(--e-in),opacity var(--t2) var(--e),overlay var(--t3) allow-discrete,display var(--t3) allow-discrete}
  @starting-style{dialog[open]{transform:scale(.96);opacity:0}}
  .maniglia{display:none}
  .foglio{padding:24px}
}

/* il menu della persona, il messaggio che arriva */
[popover]{border:0;padding:8px;border-radius:16px;background:var(--carta);color:var(--ink);box-shadow:0 18px 40px -12px rgba(0,0,0,.35);
  margin:calc(env(safe-area-inset-top) + 62px) 12px auto auto;display:flex;flex-direction:column;gap:4px;min-width:200px;
  transition:opacity var(--t2) var(--e),transform var(--t2) var(--e),overlay var(--t2) allow-discrete,display var(--t2) allow-discrete;
  opacity:1;transform:none}
[popover]:not(:popover-open){display:none;opacity:0;transform:translateY(-6px) scale(.98)}
@starting-style{[popover]:popover-open{opacity:0;transform:translateY(-6px) scale(.98)}}
[popover] button{text-align:left;border:0;background:none;padding:12px;border-radius:10px;font-weight:700}
.biglietto{position:fixed;z-index:9;left:50%;bottom:calc(var(--nav) + 92px + env(safe-area-inset-bottom));translate:-50% 0;display:flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--fondo);padding:10px 16px 10px 10px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100vw - 32px);
  animation:biglietto 3.6s var(--e) both;pointer-events:none}
.biglietto .tessera{--d:28px}
@keyframes biglietto{0%{opacity:0;transform:translateY(16px) skewX(-6deg)}8%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
@media (min-width:900px){.biglietto{bottom:32px;left:calc(50% + 135px)}}

/* l'ingresso */
.ingresso{min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.ingresso .dentro{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.ingresso .grande{width:min(46vw,190px);margin:0 auto -6px;display:block;overflow:visible}
.ingresso .logo{justify-content:center;font-size:clamp(26px,8vw,36px)}
.carta{background:var(--carta);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -24px rgba(120,0,0,.35)}
.anima rect{transform-box:fill-box;transform-origin:center;animation:pezzo 620ms var(--e-in) both;animation-delay:calc(var(--i) * 28ms)}
@keyframes pezzo{from{opacity:0;transform:translate(-40px,-26px) skewX(-24deg) scale(.4)}}
.respira rect{animation:respira 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * 70ms);transform-box:fill-box;transform-origin:center}
@keyframes respira{50%{opacity:.25;transform:scale(.8)}}

/* l'entrata delle cose: salgono e si raddrizzano, come i blocchi del logo */
.entra>*{animation:entra var(--t3) var(--e-in) both;animation-delay:calc(min(var(--i,0),8) * 40ms)}
@keyframes entra{from{opacity:0;transform:translateY(16px) skewY(1.6deg)}}
@keyframes esce{to{opacity:0;transform:translateY(-8px)}}
::view-transition-group(*){animation-duration:var(--t2);animation-timing-function:var(--e)}
::view-transition-new(*):only-child{animation:entra var(--t3) var(--e-in) both}
::view-transition-old(*):only-child{animation:esce var(--t1) var(--e-out) both}
html.cambio .riga{view-transition-name:none!important}
html.cambio::view-transition-old(vista){animation:esce var(--t1) var(--e-out) both}
html.cambio::view-transition-new(vista){animation:entra var(--t3) var(--e-in) both}
::view-transition-group(pill){animation-duration:var(--t3);animation-timing-function:cubic-bezier(.2,.9,.25,1.08)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

// ── gli allegati delle reference (foto, video, documenti): il passacarte (functions/…/api/allegati) dà il permesso, il
//    browser manda il file direttamente al Drive della squadra, e poi li si rilegge solo passando dal passacarte.
//    Delle immagini si carica l'originale e una miniatura da 400 px per l'elenco. Senza collegamento il campo non si vede.
const API="api/allegati";
let allegatiPronti=false, scelti=[];
fetch(API+"/stato").then(r=>r.json()).then(j=>{allegatiPronti=!!j.pronto;$("r-all-campo").hidden=!allegatiPronti}).catch(()=>{});
const tokenSb=async()=>(await sb.auth.getSession()).data.session?.access_token||"";
const eImmagine=t=>/^image\/(jpeg|png|webp|gif|heic|heif|avif)$/.test(t||"");
const peso=n=>n>=1e9?(n/1e9).toFixed(1).replace(".",",")+" GB":n>=1e6?(n/1e6).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1e3))+" KB";
const estensione=n=>(String(n).match(/\.([a-z0-9]{1,5})$/i)||[,"file"])[1].toUpperCase();
async function bitmap(f){
  try{return await createImageBitmap(f,{imageOrientation:"from-image"})}
  catch(e){const i=new Image();i.src=URL.createObjectURL(f);await i.decode();return i}
}
async function miniatura(f){
  const b=await bitmap(f), k=Math.min(1,400/Math.max(b.width,b.height)), c=document.createElement("canvas");
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.7));
}
function disegnaScelti(){
  $("r-all-anteprima").replaceChildren(...scelti.map((f,i)=>el("button",{type:"button",class:eImmagine(f.type)?"":"etichetta","aria-label":"Togli "+f.name,
    onclick:()=>{scelti.splice(i,1);disegnaScelti()}},eImmagine(f.type)?el("img",{src:URL.createObjectURL(f),alt:""}):`${estensione(f.name)} · ${corto(f.name)} · ${peso(f.size)}`)));
}

// un file: si chiede il permesso al passacarte, poi PUT diretto a Google con l'avanzamento
async function spedisci(blob,nome,tipo,mini,avanza){
  const s=await fetch(API+"/sessione",{method:"POST",headers:{Authorization:"Bearer "+await tokenSb(),"Content-Type":"application/json"},body:JSON.stringify({nome,tipo,mini})});
  if(!s.ok)throw new Error("sessione "+s.status);
  const {url}=await s.json();
  return new Promise((ok,ko)=>{
    const x=new XMLHttpRequest();x.open("PUT",url);x.setRequestHeader("Content-Type",tipo);
    x.upload.onprogress=e=>e.lengthComputable&&avanza&&avanza(e.loaded/e.total);
    x.onload=()=>x.status<300?ok(JSON.parse(x.responseText).id):ko(new Error("drive "+x.status));
    x.onerror=()=>ko(new Error("rete"));x.send(blob);
  });
}
// uno alla volta; se uno non passa la reference non si salva
async function caricaAllegati(testo){
  const fatti=[];
  for(const [i,f] of scelti.entries()){
    const tipo=f.type||"application/octet-stream", base=`${oggi()} ${io} ${(testo||"reference").slice(0,40)}`;
    const dice=q=>avvisoFoglio(`Carico ${i+1} di ${scelti.length} sul Drive (${f.name}): ${Math.round(q*100)}%`);
    try{
      dice(0);
      const id=await spedisci(f,`${base} - ${f.name}`,tipo,false,dice);
      let mini=null;
      if(eImmagine(tipo))try{mini=await spedisci(await miniatura(f),`${base} - ${f.name} (miniatura).jpg`,"image/jpeg",true)}catch(e){}
      fatti.push({id,mini,nome:f.name,tipo,peso:f.size});
    }catch(e){avvisoFoglio(`«${f.name}» non è arrivato sul Drive: riprova fra poco. La reference non è ancora salvata.`);return null}
  }
  $("avviso-foglio").hidden=true;
  return fatti;
}
const urlAll=new Map();
function src(id){
  if(!urlAll.has(id))urlAll.set(id,(async()=>{
    const r=await fetch(API+"/"+id,{headers:{Authorization:"Bearer "+await tokenSb()}});
    if(!r.ok)throw r.status;
    return URL.createObjectURL(await r.blob());
  })().catch(e=>{urlAll.delete(id);throw e}));
  return urlAll.get(id);
}

      return el("button",{type:"button","aria-label":"Apri "+f.nome,onclick:()=>apri(f)},img)}

}

// ponytail: i caratteri di serie di jsPDF coprono solo il Latin-1, emoji e simboli cadono. Se servono, va incorporato un font.
const piano=s=>String(s||"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[^\n\x20-\xFF]/g,"").trim();
// il simbolo del logo, disegnato a blocchi come nella pagina (viewBox -40 -30 560 540, translate 70 e skewX -14)
function simboloPdf(doc,x0,y0,largo){
  const s=largo/560, t=Math.tan(14*Math.PI/180), w=59.97, pt=(x,y)=>[x0+(110+x-t*y)*s,y0+(y+30)*s];
  const forma=stile=>BLOCCHI.forEach(([x,y])=>{const a=pt(x,y),b=pt(x+w,y),c=pt(x+w,y+w),d=pt(x,y+w);
    doc.lines([[b[0]-a[0],b[1]-a[1]],[c[0]-b[0],c[1]-b[1]],[d[0]-c[0],d[1]-c[1]]],a[0],a[1],[1,1],stile,true)});
  doc.setLineJoin("round");doc.setDrawColor(255,51,51);doc.setFillColor(255,51,51);doc.setLineWidth(30*s);forma("FD");
  doc.setFillColor(234,255,156);forma("F");doc.setLineWidth(.2);
}
function componi(){
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), L=16, W=178;
  const INK=[0,0,0], TENUE=[106,67,71], ROSSO=[255,51,51], LIME=[234,255,156], CARTA=[255,245,245];
  const rgb=h=>{h=h.length===4?"#"+[...h.slice(1)].map(c=>c+c).join(""):h;return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))};
  const pagina=()=>{doc.setFillColor(255,220,222);doc.rect(0,0,210,297,"F")};
  let y=0;
  const posto=h=>{if(y+h>280){doc.addPage();pagina();y=18}};
  // la domanda in graziato dentro l'etichetta lime, sopra la fascia rossa con la scritta larga
  const titolo=(dom,t,grande)=>{
    const fs=grande?19:13, bh=grande?11.5:8.5, dh=grande?9:7.2;
    posto(bh+dh+24);
    doc.setFont("helvetica","bold");doc.setFontSize(fs);
    const T=t.toUpperCase(), bw=doc.getTextWidth(T)+10, by=y+dh-1.6;
    doc.setFillColor(...ROSSO);doc.rect(L,by,bw,bh,"F");doc.setTextColor(...INK);doc.text(T,L+5,by+bh*.73);
    doc.setFont("times","italic");doc.setFontSize(grande?17:13.5);
    doc.setFillColor(...LIME);doc.rect(L+4,y,doc.getTextWidth(dom)+7,dh,"F");doc.text(dom,L+7.5,y+dh*.74);
    y=by+bh+6;
  };
  // la tessera di una persona: il suo colore, con l'iniziale
  const tessera=(n,x,yy,d)=>{const p=P(n);doc.setFillColor(...rgb(p.c));doc.roundedRect(x,yy,d,d,1.6,1.6,"F");
    doc.setTextColor(...rgb(p.f));doc.setFont("helvetica","bold");doc.setFontSize(d*2.1);doc.text(String(n||"?")[0].toUpperCase(),x+d/2,yy+d*.7,{align:"center"})};
  const voce=({testo,da,sotto,link,refs,spunta,tardi})=>{
    const X=L+13, TW=W-18;
    doc.setFont("helvetica","bold");doc.setFontSize(10.5);
    const righe=doc.splitTextToSize(piano(testo)||"-",TW-(tardi?22:0)), linee=[];
    if(link)linee.push({t:doc.splitTextToSize(link,TW)[0],url:link,c:[200,30,30]});
    (refs||[]).forEach(r=>{const u=indirizzo(r.link);linee.push({t:"Reference: "+piano(corto(r.testo))+(u?"  ("+u.hostname.replace(/^www\./,"")+")":""),url:u&&u.href,c:INK,b:true})});
    if(sotto)linee.push({t:piano(sotto),c:TENUE});
    const h=5.5+righe.length*4.6+linee.length*4.3+2;
    posto(h+2.5);
    doc.setFillColor(...CARTA);doc.roundedRect(L,y,W,h,2.5,2.5,"F");
    if(spunta){doc.setDrawColor(...INK);doc.setLineWidth(.5);doc.roundedRect(L+4.4,y+3.3,4.4,4.4,1,1,"S");doc.setLineWidth(.2)}
    else if(da)tessera(da,L+4,y+3,6.2);
    if(tardi){doc.setFillColor(...ROSSO);doc.roundedRect(L+W-25,y+3,21,5,1,1,"F");doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.setFontSize(6.5);doc.text("IN RITARDO",L+W-14.5,y+6.4,{align:"center"});doc.setFontSize(10.5)}
    let yy=y+7.2;doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...INK);doc.text(righe,X,yy);yy+=righe.length*4.6;
    doc.setFontSize(8.5);
    for(const r of linee){doc.setFont("helvetica",r.b?"bold":"normal");doc.setTextColor(...r.c);
      r.url?doc.textWithLink(r.t,X,yy,{url:r.url}):doc.text(r.t,X,yy);yy+=4.3}
    y+=h+2.5;
  };
  const niente=t=>{posto(10);doc.setFont("times","italic");doc.setFontSize(11.5);doc.setTextColor(...TENUE);doc.text(t,L+2,y+3);y+=11};
  const chiE=v=>[v.da,giorno(v.creato)].filter(Boolean).join("  ·  ");

  pagina();
  simboloPdf(doc,140,8,58);
  doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.setFontSize(40);doc.text("BARI",L,30);
  doc.setFont("helvetica","bolditalic");doc.text("SPARSA",L,45);
  y=58;titolo("Cosa portiamo?","Verso la riunione",true);
  const idee=nuove("idee").sort(recenti), ref=nuove("reference").sort(recenti), comp=aperti();
  doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...TENUE);
  doc.text(`${oggi().split("-").reverse().join("/")}  ·  ${idee.length} idee  ·  ${ref.length} reference  ·  ${comp.length} compiti aperti`,L,y);y+=10;

  titolo("E se...?",`Idee da discutere  ${idee.length}`);
  idee.length?idee.forEach(v=>voce({testo:v.testo,da:v.da,sotto:chiE(v),refs:(v.refs||[]).map(id=>dati.reference.find(r=>r.id===id)).filter(Boolean)})):niente("Nessuna idea nuova.");
  y+=4;titolo("Cosa avete visto?",`Reference nuove  ${ref.length}`);
  ref.length?ref.forEach(v=>voce({testo:v.testo||"(allegati)",da:v.da,sotto:chiE(v)+((v.allegati||[]).length?`  ·  ${v.allegati.length} allegati sul Drive`:""),link:(indirizzo(v.link)||{}).href})):niente("Nessuna reference nuova.");
  y+=4;titolo("Chi fa cosa?",`Compiti aperti  ${comp.length}`);
  if(!comp.length)niente("Nessun compito aperto.");
  for(const p of NOMI){
    const miei=comp.filter(t=>(t.chi||[]).includes(p)).sort(perScadenza); if(!miei.length)continue;
    posto(22);tessera(p,L,y,6.5);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...INK);doc.text(p.toUpperCase(),L+9,y+5);y+=10;
    miei.forEach(t=>voce({testo:t.cosa,spunta:true,tardi:t.entro&&t.entro<oggi(),sotto:[t.entro&&"entro il "+giorno(t.entro),t.da&&"da "+t.da].filter(Boolean).join("  ·  ")}));
    y+=2;
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...TENUE);
    doc.text("BARI SPARSA  ·  GESTIONE INTERNA",L,290);doc.text(`${i} / ${n}`,L+W,290,{align:"right"})}
  return doc;
}
function scaricaPdf(){
  try{componi().save("Bari Sparsa - verso la riunione "+oggi()+".pdf")}
  catch(e){avvisa("Il PDF non è stato scaricato. Riprova fra qualche secondo.")}
}
$("m-pdf").addEventListener("click",()=>{$("menu").hidePopover();scaricaPdf()});
$("m-esci").addEventListener("click",()=>{$("menu").hidePopover();sb.auth.signOut()});

// ── l'ingresso ──
const logoHTML=`<span>BARI</span><svg class="simbolo" viewBox="-40 -30 560 540" aria-hidden="true">${simbolo()}</svg><em>SPARSA</em>`;
$("simbolo-grande").innerHTML=simbolo();$("simbolo-carico").innerHTML=simbolo();
document.querySelector("#v-ingresso .logo").innerHTML=logoHTML;
$("logo-testa").innerHTML=logoHTML;
$("logo-testa").addEventListener("click",e=>{e.preventDefault();vai("mio")});

function stato(s,testo,form="m-ingresso"){
  $("v-ingresso").hidden=s!=="fuori";$("v-carico").hidden=s!=="carico";$("v-app").hidden=s!=="dentro";$("b-piu").hidden=s!=="dentro";
  $("m-ingresso").hidden=form!=="m-ingresso";$("m-password").hidden=form!=="m-password";
  const a=$(form==="m-password"?"avviso-password":"avviso-ingresso");a.textContent=testo||"";a.hidden=!testo;
}
$("m-ingresso").addEventListener("submit",async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("e-mail").value.trim(),password:$("e-pw").value});
  if(error)stato("fuori","Email o password non tornano. Riprova, o chiedi a Peppe.");
});
$("b-dimenticata").addEventListener("click",async()=>{
  const email=$("e-mail").value.trim();
  if(!email){stato("fuori","Scrivi la tua email qui sopra, poi riclicca «Password dimenticata?».");$("e-mail").focus();return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  stato("fuori",error?"La mail non è partita. Riprova fra qualche minuto.":"Se l'indirizzo è della squadra, ti è arrivata una mail con il link per scegliere una password nuova.");
});
$("m-password").addEventListener("submit",async e=>{
  e.preventDefault();
  const {error}=await sb.auth.updateUser({password:$("n-pw").value});
  if(error){stato("fuori","La password non è stata salvata: prova con una più lunga o diversa.","m-password");return}
  daLink=false;try{sessionStorage.removeItem("bs-pw")}catch(e){}history.replaceState(null,"",location.pathname);entra();
});

// ponytail: a ogni modifica si ricarica la tabella intera; basta finché le righe sono centinaia
async function carica(k){
  const {data,error}=await sb.from(k).select("*").limit(1000);
  if(!error){dati[k]=data.map(v=>({...v,entro:v.entro||""}));pronto[k]=true;aggiorna()}
  else avvisa("Non riesco a leggere i dati. Ricarica la pagina.");
}
async function entra(){
  stato("carico");
  const [{data:nome},{data:u}]=await Promise.all([sb.rpc("mio_nome"),sb.auth.getUser()]);
  if(!nome){stato("fuori","Il tuo account esiste ma non è nella squadra: chiedi a Peppe di aggiungerti.");return}
  io=nome;uid=u.user.id;
  const p=P(io);$("b-io").replaceChildren(tessera(io));
  const {data:mia}=await sb.from("personale").select("*").maybeSingle();
  prima=mia?.ultima_visita||null;viste=new Set(mia?.viste||[]);appunti.value=mia?.appunti||"";note=Array.isArray(mia?.note)?mia.note:[];disegnaNote();
  sb.from("personale").upsert({user_id:uid,ultima_visita:new Date().toISOString()}).then(()=>{});
  stato("dentro");disegna();
  await Promise.all(Object.keys(dati).map(carica));
  sb.channel("squadra").on("postgres_changes",{event:"*",schema:"public"},x=>{
    if(!dati[x.table])return;
    carica(x.table);
    const n=x.new||{};
    if(x.eventType==="INSERT"&&n.da&&n.da!==io)biglietto(n.da,`${n.da} ha aggiunto ${x.table==="idee"?"un'idea":x.table==="task"?"un compito":"una reference"}`);
  }).subscribe(s=>{if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")avvisa("La pagina non si aggiorna più da sola. Ricaricala.")});
}
let dentro=false;
sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==="PASSWORD_RECOVERY")daLink=true;
  if(s&&daLink){dentro=true;stato("fuori","","m-password")}
  else if(s&&!dentro){dentro=true;setTimeout(entra)}
  else if(!s){dentro=false;sb.removeAllChannels();for(const k in dati){dati[k]=[];pronto[k]=false}primaVolta=true;viste=new Set();daLink=false;try{sessionStorage.removeItem("bs-pw")}catch(e){}
    stato("fuori",linkGuasto?"Il link è scaduto o è già stato usato. Scrivi la tua email qui sopra e tocca «Password dimenticata?»: ne arriva uno nuovo.":"");
    if(linkGuasto){linkGuasto=false;history.replaceState(null,"",location.pathname)}}
});
</script>
